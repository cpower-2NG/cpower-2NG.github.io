name: Build and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 内容不再由 CI 从 Git 源编译：静态产物由 tools/materialize-site.mjs
      # 从数据库生成后提交（Git 保留的是发布快照），CI 只做校验与部署。
      - name: Install test dependencies
        run: |
          npm ci --prefix sync
          npm ci --prefix api
          cd sync
          npx playwright install --with-deps chromium
      - name: Run unit and API tests
        run: |
          node --test tests/*.test.mjs
          npm test --prefix sync
          npm test --prefix api
      - name: Run browser end-to-end checks
        run: node tests/e2e/site-navigation.mjs
      - name: Prepare static artifact
        run: |
          mkdir -p .pages
          cp -r 404.html assets content core data feed.xml index.html sitemap.xml admin.html robots.txt moment .pages/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
