<article class="article-surface moment"><div class="moment__meta">2023-09-17</div><p>推冬滚滚的时候突然意识到，为什么我对侦探类小说没什么兴趣了。其往往会让人物设计服务于故事进行，轨迹的精妙与解密的爽快成为了角色行为的外驱力。不准确是概括就是舞台剧般的人设，鲜明突出，但是缺少魅力。另外，同样是于舞台上演戏，rukuru很好的平衡了这一点，或许是其类舞台剧的世界观却又叛逆而行的风格导致的，总能展现人物的内驱力。不过这样让其结尾总是棋差一着，吊着口气，或许那几部我没玩的新作有改善吧。</p></article>
