<article class="article-surface moment"><div class="moment__meta">2021-08-08</div><p>大多数人只不过是靠着“惯性”生活，日复一日的重复这机械的运动。可一旦这生活的惯性改变了，人们就会开始焦躁、不安，乃至迁怒他人。平日里习以为常的行为，也可能成为导火索。可那些人并没有做错什么，只是失去了名为“惯性”的麻醉药，无法抵抗压力与烦恼。或许这就是为什么讨厌假期的真正原因。</p></article>
