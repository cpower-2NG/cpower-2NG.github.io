<article class="article-surface moment"><div class="moment__meta">2023-08-19</div><p>作为近些年的作品，9-nine应该是极少数的高完成度gal了。主线的编排可圈可点，角色的塑造更是一绝。总而言之算是我推的最顺畅的作品了。当然，问题同样明显。一个是经典要素的大量出现，很明显的，强烈的既视感充斥的整部作品，到底是新时代的作品了，缺少创新还是有点遗憾的，不过倒是让我这种王道爱好者感到安心啊。另外一个问题就是故事逻辑了，分割商法的影响也好，多线并行的难度也罢，既然作为类时空穿越的作品，设定逻辑的考究是必不可少的，整体来看还是无法掌握啊。不过瑕不掩瑜，依旧是最喜欢的作品之一了 。话说新章是想讲什么，好像要确定喵都为真女主？还没推不是很懂啊。</p></article>
