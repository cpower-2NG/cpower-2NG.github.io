<article class="article-surface moment"><div class="moment__meta">2022-01-24</div><p>天性<br>天性作为与生俱来的特性，具有的是天然性，是不为外物抹除的，最多只是渐渐消退。因此天性是不同于理性的，是感性的范畴，并且是先于理性思考的。举个例子，一个普通中学生遇到老人摔倒，第一反应是扶不扶，而不是管不管，即使是理性的警告也会产生怜悯.这时的第一反应是帮助，再然后是理性的利弊权衡。所以说天性具有更高的优先级，只是受限于理性经验的判断。这也是为什么说人的社会化是一个理性增长而感性消退的过程，这正是因为原初的情感判断是存在善恶对错的，而理性只是逐利的，至少会考虑他人、自己的利益。</p></article>
