<article class="article-surface moment"><div class="moment__meta">2023-06-14</div><p>这集是算p回吧，还是全员回呢（笑），346大量客串，更是有枫姐冷笑话和调戏米内p。回到故事上，很好的接续了上集的新曲，克服大人困难（靠更大的人？），还引入了橘小姐的心结，目前来看有点春香的味道啊（不行，这不够苍），让人很是期待下一集橘小姐回又会如何。至于这集的live，那也是远不如ep6的lipps，基本是强行描3d画出来的（甚至成片里都没有3d的卡了，感觉不如把这部分人力抽去修卡，或者说想在BD里大修吗）。也可以理解，剧情上属于宣传视频，工期也是非常紧迫，组里又没大佬画。不过听说画原画的群友说，最后一集有真神降临，能贡献精彩的live卡，心怀期待把！</p></article>
