<article class="article-surface moment"><div class="moment__meta">2020-12-10</div><p>唯庚子戊子丁亥丁未，台湾地动，震及福建。次日其人惊见岛中现一大地缝，宽及数尺。其人以灯照之，见其中有一石板，遂取之。拂其上尘土，见籀文十二，曰：爪木草，何青青！裂国土，不得生。其人大惊，乃叹曰：天数有变，神器更易，此皆间示吾等当早日弃暗投明也！岛内民心遂顺。<img class="moment__emoticon" src="https://qzonestyle.gtimg.cn/qzone/em/e248.gif" alt="[表情]"></p></article>
