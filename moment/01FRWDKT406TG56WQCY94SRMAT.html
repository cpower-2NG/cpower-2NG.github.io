<article class="article-surface moment"><div class="moment__meta">2022-01-08</div><p>在原始社会之前，人类自然的诞生了偶像崇拜，也就是各种神及信仰，以此通过彼此间出现的认同，使每个个体放弃部分个人利益，融入群体以收获认同，进而形成社会，达成共同体来对抗外界。但当偶像被异化，凝聚起来靠的不是认同，而是先于自身存在的无法抗拒只能接受的社会中的“偶像”本身。到此，人类成为了文明的野兽。幼稚且弱小的质疑，与成熟且强大的信仰，彼此不断碰撞，才应该算是文明的成长。到如今，知晓（形成）这衍化道理的行为，是否也是一种异化呢？</p></article>
