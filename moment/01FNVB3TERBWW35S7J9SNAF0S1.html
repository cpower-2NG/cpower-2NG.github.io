<article class="article-surface moment"><div class="moment__meta">2021-12-01</div><p>暴风雨前的宁静，总是焦躁的，狂欢的，不安的，歇斯底里的。呈现出的总是熟悉事物的繁荣热闹的，却又透露着大厦将倾之感。而战后的平静，又总是死寂的，惊悸的，渺远的，空灵纯粹的。是重归身边真实事物的，是砂石瓦砾朝阳小树的，是寄希望于未来的。是牺牲，是憧憬，是毁灭，是新生，是侘末，是寂始。是真正的，社会的“静”<br> ——听《日本沉没2020ost》有感</p></article>
