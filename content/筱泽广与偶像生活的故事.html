<article class="article-surface"><p>正好借此机会说说我心中的广吧，虽然更多是我自己的主观投射（笑）。<br>小广她​大多数时候表现出来的夸张的抖m属性和对困难、失败、绝望的痴迷，源于的是对自身故事性和情感性的追求。可以是因为曾经的自己太一帆风顺，也可以是对可爱的偶像有了憧憬，但最后让她选择穿上华美的演出服站上舞台，享受汗水泪水、享受失败胜利，是她追求一个身体孱弱的人或许也能成为偶像的王道故事。<br>​她会为享受心脏的跳动而追求身心的痛苦，但这并不意味着她不喜欢成功。她同样会因为抓住了那千万分之一的可能性而欢呼雀跃。她只是对上卷书一帆风顺的单调故事感到麻木压抑。<br>​或者更简单的说，筱泽广，她正在享受偶像的生活，喜爱着努力成为偶像的自己。</p></article>
