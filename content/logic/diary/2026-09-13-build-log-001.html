<p><code>build.mjs</code> 已接入，内容管线现在是这样的：</p>
<ul><li><code>content-src/**/*.md</code> 编译为 <code>content/**/*.html</code> 片段</li><li>front-matter 汇总进 <code>data/entries.json</code></li><li>仪表盘、命令面板、文章页导航全部吃这份索引</li></ul>
<p>写作流程：在 <code>content-src</code> 下建一个 <code>.md</code> 文件 → 写完双击 <code>build.cmd</code> → 刷新页面。</p>
<p>本篇本身就是构建脚本的第一份产物。</p>
