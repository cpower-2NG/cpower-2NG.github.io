<!DOCTYPE html>
<html lang="zh-CN" data-phase="logic">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BIFROST 是一个双位面个人阅读与记录空间，收录日常动态、漫评、活动纪录与杂记。">
    <title>BIFROST</title>
    <meta name="theme-color" content="#f6f0e7">
    <meta property="og:site_name" content="BIFROST">
    <meta property="og:type" content="website">
    <meta property="og:title" content="BIFROST — 个人阅读空间">
    <meta property="og:description" content="在 Logic 与 Fantasy 两个位面之间，阅读记录、活动见闻与慢慢写下的文字。">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link rel="alternate" type="application/rss+xml" title="BIFROST 更新" href="/feed.xml">
    <link rel="stylesheet" href="/core/style.css">
    <script defer src="/core/ambience.js"></script>
    <script defer src="/core/media-preview.js"></script>
    <script defer src="/core/interactions.js"></script>
    <script defer src="/core/engine.js"></script>
</head>
<body>
    <div class="shell">
        <header class="header">
            <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="site-sidebar">
                <span class="nav-toggle__mark" aria-hidden="true">≡</span>
                <span class="nav-toggle__label">目录</span>
            </button>
            <div class="brand">
                <span class="brand__mark" aria-hidden="true">//</span>
                <h1 class="brand__title" data-site-title>BIFROST</h1>
                <p class="brand__sub" data-site-subtitle>正在读取内容索引</p>
            </div>
            <div class="header__meta">
                <button class="sound-toggle" type="button" data-sound-toggle aria-pressed="false">
                    <span class="sound-toggle__mark" aria-hidden="true">◌</span>
                    <span data-sound-label>环境音 关闭</span>
                </button>
                <span class="phase-pill" data-phase-pill>Logic</span>
                <button class="command-trigger" type="button" data-search-trigger aria-haspopup="dialog" aria-controls="search-panel">
                    <kbd class="command-trigger__key" aria-hidden="true">⌘K</kbd>
                    <span class="command-trigger__label">搜索</span>
                </button>
                <button class="command-trigger" type="button" data-phase-trigger aria-haspopup="dialog" aria-controls="phase-panel">
                    <kbd class="command-trigger__key" aria-hidden="true">~</kbd>
                    <span class="command-trigger__label">位面</span>
                </button>
            </div>
        </header>

        <aside class="sidebar" id="site-sidebar">
            <section class="sidebar__section">
                <div class="sidebar__intro">
                    <span class="sidebar__index">01</span>
                    <h2 class="sidebar__heading">导航</h2>
                </div>
                <nav class="tree" data-tree aria-label="站点导航"></nav>
            </section>

            <section class="sidebar__section">
                <div class="sidebar__intro">
                    <span class="sidebar__index">02</span>
                    <h2 class="sidebar__heading">状态</h2>
                </div>
                <div class="status-note">
                    <p class="hero__eyebrow">当前位面</p>
                    <p class="hero__text" data-status-text>正在准备内容…</p>
                    <p class="hero-ext" data-status-title>更新于 —</p>
                </div>
            </section>
        </aside>

        <main class="main">
            <div class="content-viewer" data-view>
                <section class="article-surface">
                    <p class="hero__eyebrow">BIFROST</p>
                    <h1 class="hero__title">正在打开阅读空间</h1>
                    <p class="hero__text">如果这里短暂停留，说明内容索引还在准备。</p>
                </section>
            </div>
        </main>

        <footer class="footer">
            <span class="status"><span class="status__dot"></span><span data-footer-status>正在准备</span></span>
            <span class="footer__meta"><span data-footer-clock></span><span>BIFROST · 个人阅读空间</span></span>
        </footer>
    </div>

    <section class="command-overlay" id="search-panel" data-search-panel aria-label="搜索" role="dialog" aria-modal="true">
        <div class="command-panel search-panel">
            <input class="command-input" data-search-input type="search" autocomplete="off" placeholder="搜索标题、正文与标签">
            <div class="search-facets" data-search-facets></div>
            <div class="command-results" data-search-results></div>
            <p class="command-help">输入关键词，或点选筛选条件组合查找 · ↑↓ 选择 · Enter 打开 · Esc 关闭</p>
        </div>
    </section>

    <section class="command-overlay" id="phase-panel" data-phase-panel aria-label="位面切换" role="dialog" aria-modal="true">
        <div class="command-panel">
            <div class="command-results" data-phase-results></div>
            <p class="command-help">↑↓ 选择 · Enter 切换 · Esc 关闭</p>
        </div>
    </section>

    <section class="boot-overlay" data-boot-overlay aria-label="启动序列" role="status" aria-live="polite">
        <div class="boot-panel">
            <div class="boot-log" data-boot-log></div>
            <div class="boot-bar"><i data-boot-bar></i></div>
        </div>
    </section>
</body>
</html>
