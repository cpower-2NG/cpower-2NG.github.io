<!DOCTYPE html>
<html lang="zh-CN" data-phase="fantasy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // GitHub Pages 深链修复：内容页各有自己的静态文件；
        // 走到 404 说明地址确实不存在，带回首页并说明原因即可。
        (function () {
            if (window.location.pathname.endsWith('/404.html')) return;
            window.location.replace('/');
        })();
    </script>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#f6f0e7">
    <title>404 · BIFROST</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link rel="stylesheet" href="/core/style.css">
</head>
<body>
    <main class="main">
        <section class="article-surface">
            <p class="hero__eyebrow">BIFROST</p>
            <h1 class="hero__title">这一页没有找到</h1>
            <p class="hero__text">链接可能已经移动，或者对应的内容还没有准备好。</p>
            <div class="article-actions">
                <a class="button button--primary" href="/">返回首页</a>
            </div>
        </section>

        <p class="hero-xz">BIFROST</p>
    </main>
</body>
</html>
