<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <meta name="theme-color" content="#f4f6f8">
    <title>BIFROST 管理台</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link rel="stylesheet" href="/core/admin.css">
    <!-- MSAL 本地托管：jsdelivr 在部分网络不可达，会导致 Microsoft 登录永远转圈 -->
    <script defer src="/core/vendor/msal-browser.min.js"></script>
    <script type="module" src="/core/admin/app.js"></script>
</head>
<body>

    <section class="gate" data-gate hidden>
        <div class="gate__card">
            <p class="gate__eyebrow">BIFROST · CONTROL PLANE</p>
            <h1>管理员登录</h1>
            <p class="muted">登录后才能管理内容、评论与同步任务。</p>
            <button type="button" class="btn btn--primary btn--block" data-gate-ms>使用 Microsoft 账号登录</button>
            <div class="gate__divider"><span>或使用站点口令</span></div>
            <form class="gate__form" data-gate-form>
                <input class="input" data-gate-user placeholder="管理员账号" autocomplete="username">
                <input class="input" data-gate-pass type="password" placeholder="口令" autocomplete="current-password">
                <button type="submit" class="btn btn--primary btn--block" data-gate-submit>登录</button>
            </form>
            <p class="msg" data-gate-message></p>
            <a class="btn btn--block" href="/">返回站点</a>
        </div>
    </section>

    <div class="shell" data-shell hidden>
        <aside class="sidebar" data-sidebar>
            <div class="sidebar__brand">
                <p class="sidebar__eyebrow">BIFROST</p>
                <strong>管理台</strong>
            </div>
            <nav class="nav" data-nav>
                <a class="nav__item" data-nav-item="overview" href="#/overview">概览</a>
                <p class="nav__group">内容</p>
                <a class="nav__item" data-nav-item="entries" href="#/entries">条目</a>
                <a class="nav__item" data-nav-item="series" href="#/series">系列</a>
                <a class="nav__item" data-nav-item="tags" href="#/tags">标签</a>
                <a class="nav__item" data-nav-item="moments" href="#/moments">动态</a>
                <p class="nav__group">来源</p>
                <a class="nav__item" data-nav-item="upload" href="#/upload">上传导入</a>
                <a class="nav__item" data-nav-item="qzone" href="#/qzone">QQ 空间同步</a>
                <p class="nav__group">互动</p>
                <a class="nav__item" data-nav-item="comments" href="#/comments">评论 <span class="nav__count" data-nav-count="pendingComments" hidden></span></a>
                <p class="nav__group">系统</p>
                <a class="nav__item" data-nav-item="rules" href="#/rules">同步规则</a>
                <a class="nav__item" data-nav-item="export" href="#/export">数据导出</a>
            </nav>
            <div class="sidebar__foot">
                <div class="side-status">
                    <span class="side-status__item" data-side-qzone title="QQ 连接状态"><i class="dot dot--muted" data-side-qzone-dot></i><span data-side-qzone-text>QQ 未连接</span></span>
                    <span class="side-status__item" data-side-publish hidden><span class="dot dot--warn"></span>有待发布</span>
                </div>
                <div class="sidebar__account">
                    <span data-account>已登录</span>
                    <button type="button" class="btn btn--sm" data-admin-logout>退出</button>
                </div>
                <a class="sidebar__back" href="/">返回站点 →</a>
            </div>
        </aside>

        <div class="main">
            <header class="topbar">
                <div class="topbar__left">
                    <button type="button" class="btn btn--sm topbar__menu" data-menu aria-label="打开菜单">☰</button>
                    <h1 class="topbar__title" data-view-title>概览</h1>
                </div>
                <button type="button" class="btn btn--sm" data-refresh>刷新</button>
            </header>
            <main class="view" data-view></main>
        </div>
    </div>

    <div class="toast-stack" data-toasts></div>
    <div data-modal></div>
</body>
</html>
